{% extends 'core/base.html' %}


{% block title %}
    Editar publicación
{% endblock %}


{% block content %}

    <h2>
        Editar publicación
    </h2>


    <p class="page-description">
        Modificá el contenido de tu publicación.
    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Guardar cambios
        </button>

    </form>


    <br>


    <a href="{% url 'core:detalle_publicacion' object.id %}">
        Cancelar
    </a>

{% endblock %}
