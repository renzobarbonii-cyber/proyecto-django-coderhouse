{% extends 'core/base.html' %}


{% block title %}
    Agregar producto
{% endblock %}


{% block content %}

    <h2>Agregar producto</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar producto
        </button>

    </form>

    <br>

    <a href="{% url 'core:lista_productos' %}">
        Cancelar
    </a>

{% endblock %}
