{% extends 'core/base.html' %}


{% block title %}
    Eliminar producto
{% endblock %}


{% block content %}

    <h2>Eliminar producto</h2>

    <p>
        ¿Seguro que querés eliminar
        <strong>{{ object.nombre }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <br>

    <a href="{% url 'core:lista_productos' %}">
        Cancelar
    </a>

{% endblock %}
