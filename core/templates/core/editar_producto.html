{% extends 'core/base.html' %}


{% block title %}
    Editar producto
{% endblock %}


{% block content %}

    <h2>Editar producto</h2>

    <p>
        Estás editando:
        <strong>{{ object.nombre }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="{% url 'core:lista_productos' %}">
        Cancelar
    </a>

{% endblock %}
