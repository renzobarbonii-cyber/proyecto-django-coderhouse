<!DOCTYPE html>
<html>

<head>
    <title>Editar producto</title>
</head>

<body>

    <h1>Editar producto</h1>

    <p>Estás editando: {{ object.nombre }}</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="{% url 'inicio' %}">
        Cancelar
    </a>

</body>

</html>
